<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>תודה שנסעתם עם H.O Travel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Varela+Round&display=swap');
    body {
      font-family: 'Varela Round', sans-serif;
      direction: rtl;
    }
    .logo-circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background-color: #A89B73;
      padding: 4px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    .logo-circle img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }
  </style>
</head>
<body class="bg-blue-50 text-gray-800 antialiased min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-8 text-center">
    <div class="logo-circle mx-auto mb-6">
      <img src="/logo.jpg" alt="H.O Travel">
    </div>
    <h1 class="text-3xl font-bold text-cyan-700 mb-3">תודה שנסעתם איתנו! ✈️</h1>
    <p class="text-lg mb-2">מקווים שנהניתם מהטיול ושצברתם חוויות..</p>
    <p class="text-gray-600 mb-4">קיט הטיול הזה כבר אינו זמין. לתיאום הטיול הבא שלכם או לכל שאלה, נשמח שתפנו אלינו.</p>
    <div class="mt-6 text-gray-700 font-semibold">הודיה אוריאן • 054-8792582</div>
  </div>
</body>
</html>
